name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plt_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]" pip-audit bandit
      - name: Lint
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type-check
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -q --junitxml=junit-sqlite.xml
      - name: Report SQLite failures
        if: failure()
        run: python ../.github/scripts/junit_annotations.py junit-sqlite.xml
      - name: Tests (MySQL 8.4, incl. concurrency suite)
        env:
          TEST_DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/plt_test
        run: pytest -q --junitxml=junit-mysql.xml
      - name: Report MySQL failures
        if: failure()
        run: python ../.github/scripts/junit_annotations.py junit-mysql.xml
      # Migration checks are separate steps so the failing one is visible in the run summary.
      - name: "Migrations: create database"
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE plt_migrate CHARACTER SET utf8mb4"
      - name: "Migrations: upgrade head"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          alembic upgrade head 2>&1 | tail -40 | sed "s/^/    /" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Migrations: drift check (models vs MySQL schema)"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          alembic check 2>&1 | tail -40 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Migrations: downgrade base, then upgrade head"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          { alembic downgrade base && alembic upgrade head; } 2>&1 | tail -40 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Security scans
        run: |
          bandit -q -r app -ll
          pip-audit --skip-editable

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t plt-backend:${{ github.sha }} .
      - name: Trivy scan (CRITICAL/HIGH, fixable)
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1             image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress             --format table plt-backend:${{ github.sha }} > trivy.txt 2> trivy.err
          code=$?
          {
            echo '### Trivy'; echo '```'; cat trivy.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            # Annotations are visible on the run page without signing in.
            grep -E '(CVE|GHSA)-[0-9]' trivy.txt | tr -s ' │|' ' ' | head -10               | while read -r line; do echo "::error title=Trivy finding::$line"; done
            tail -5 trivy.err | while read -r line; do echo "::warning title=Trivy stderr::$line"; done
          fi
          exit $code
