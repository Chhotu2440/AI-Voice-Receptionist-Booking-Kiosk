name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plt_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]" pip-audit bandit
      - name: Lint
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type-check
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (MySQL 8.4)
        env:
          TEST_DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/plt_test
        run: pytest -q
      # Migration checks are separate steps so the failing one is visible in the run summary.
      - name: "Migrations: create database"
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE plt_migrate CHARACTER SET utf8mb4"
      - name: "Migrations: upgrade head"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          alembic upgrade head 2>&1 | tail -40 | sed "s/^/    /" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Migrations: drift check (models vs MySQL schema)"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          alembic check 2>&1 | tail -40 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Migrations: downgrade base, then upgrade head"
        env: { DATABASE_URL: "mysql+asyncmy://root:root@127.0.0.1:3306/plt_migrate" }
        run: |
          set -o pipefail
          { alembic downgrade base && alembic upgrade head; } 2>&1 | tail -40 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Security scans
        run: |
          bandit -q -r app -ll
          pip-audit --skip-editable

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t plt-backend:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: plt-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
