[project]
name = "playlasertag-backend"
version = "0.1.0"
description = "Play Laser Tag booking engine, admin API and voice gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "pymysql>=1.1",
    "cryptography>=43",  # MySQL 8 caching_sha2_password auth
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
